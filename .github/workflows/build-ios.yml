# Builds the iOS app whenever something it is built from changes on
# development or production, and uploads it to App Store Connect, where it
# goes to TestFlight.
#
# development → Ihsaanly Development (app.ihsaanly.companion.development)
# production  → Ihsaanly (app.ihsaanly.companion)
#
# Signing is automatic: Xcode creates or reuses the certificate and profiles
# with the App Store Connect API key (an Admin team key, so it can use the
# cloud-managed distribution certificate). Secrets and variables come from the
# GitHub environment named after the branch: ASC_* (1Password, "Ihsaanly App
# Store Connect API") and the EXPO_PUBLIC_* app config. See TODO.md.
name: build-ios

on:
  push:
    branches: [development, production]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'tooling/**'
      - 'bun.lock'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref_name }}
  cancel-in-progress: true

# Least privilege: every step only reads the repository.
permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == 'development' || github.ref_name == 'production'
    runs-on: macos-26
    timeout-minutes: 90
    # The GitHub environment is named after the branch.
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_VARIANT: ${{ github.ref_name }}
      # The build number: counts up from 1 across every run, so each upload is
      # higher than the last.
      BUILD_NUMBER: ${{ github.run_number }}
      # The SDK the App Store requires; also the runner's default.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Config comes from the environment's variables, never a .env file.
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_CONTENT_URL: ${{ vars.EXPO_PUBLIC_CONTENT_URL }}
      TEAM_ID: 97J332WV6P
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile
        working-directory: .

      - name: Generate the native project
        run: bunx expo prebuild -p ios --clean

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        working-directory: apps/mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace)
          xcodebuild archive \
            -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E 'error:' "$RUNNER_TEMP/archive.log"; tail -100 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/archive.log"

      # Exports with distribution signing and uploads straight to App Store
      # Connect. Xcode keeps our build number (manageAppVersionAndBuildNumber).
      - name: Upload to App Store Connect
        working-directory: apps/mobile/ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
