# The one FTPS deploy, called by deploy-marketing.yml and deploy-companion.yml.
# Builds a workspace with turbo (its build runs its own output, CSP and
# headless-Chrome checks, so any failure stops the upload) and uploads one
# folder to the host. The FTP password lives only in the repository's secrets.
#
# Secrets (Settings → Environments → "development" or "production", the
# environment named after the branch being deployed):
#   FTP_SERVER      the FTP host, e.g. ftp.ihsaanly.app
#   FTP_USERNAME    the FTP account, e.g. support@ihsaanly.app
#   FTP_PASSWORD    its password
#
# The upload folder is derived, never configured: <app>/<environment>/, e.g.
# companion/production/. The FTP account's home is /public_html/ihsaanly.app,
# the parent of every site folder (layout: apps/companion/HOSTING.md).
# Callers pass `secrets: inherit`; the secrets and the Firebase variables
# resolve here, in the job that runs in the given environment.
name: deploy-ftp

on:
  workflow_call:
    inputs:
      filter:
        description: turbo --filter for the workspace to build
        required: true
        type: string
      local-dir:
        description: the built folder to upload, ending in a slash
        required: true
        type: string
      app:
        description: the app's folder on the host (marketing, companion)
        required: true
        type: string
      environment:
        description: GitHub environment holding this branch's secrets and variables
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # This environment's Firebase web config, as environment variables
      # (not secrets): it ships in the bundle anyway, and firestore.rules is
      # what guards the data. Unset → the build is local-only, no Account row.
      - name: Build
        run: bunx turbo build --filter=${{ inputs.filter }}
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # Pinned to the v4.4.0 commit: this step holds the FTP password, so a
      # moved tag must not be able to change what runs. It uploads only what
      # changed since the last deploy and removes files that no longer exist,
      # so old hashed assets do not pile up on the host.
      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ inputs.app }}/${{ inputs.environment }}/
          local-dir: ${{ inputs.local-dir }}
          protocol: ftps
