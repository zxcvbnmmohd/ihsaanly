# Builds the marketing site and uploads apps/marketing/dist/client to the host
# over FTPS whenever something it is built from changes on production. The FTP
# password lives only in the repository's secrets, never in the code.
#
# Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      the FTP host, e.g. ftp.ihsaanly.app
#   FTP_USERNAME    the FTP account, e.g. support@ihsaanly.app
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  the web root on the host, ending in a slash, e.g. public_html/
name: deploy-marketing

on:
  push:
    branches: [production]
    paths:
      - 'apps/marketing/**'
      # The demo renders the shared screens (ui) over the shared domain (core,
      # content included), styled by the shared Tailwind tokens.
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'tooling/tailwind/**'
      - 'bun.lock'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

# Never two uploads at once: the second would race the first's sync state.
concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: website
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Prerenders every page, writes the per-page CSP into .htaccess, then runs
      # the output, CSP and headless-Chrome checks. Any failure stops the deploy.
      - name: Build the site
        run: bunx turbo build --filter=@ihsaanly/marketing

      # Pinned to the v4.4.0 commit: this step holds the FTP password, so a
      # moved tag must not be able to change what runs. It uploads only what
      # changed since the last deploy and removes files that no longer exist,
      # so old hashed assets do not pile up on the host.
      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./apps/marketing/dist/client/
          protocol: ftps
