[test]
# DOM + react-native-web (packages/ui/test/preload.ts), then this app's native-module fakes.
preload = ["../../packages/ui/test/preload.ts", "./test/setup.ts"]
# Read only by `bun test --coverage` (the test:coverage script). The root
# `bun run coverage` (scripts/coverage.ts) checks coverage/lcov.info against
# every source file in this workspace.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
